<title>Página do produto AIŌN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap">
<style>
:root{color-scheme:dark;--fundo:#101113;--sup:#191A1E;--resp:#17181B;--borda:#2B2D32;--div:#292A2F;--t1:#EEEEF0;--t2:#94979E;--t3:#7F8791;--ouro:#E2C68C;--souro:#202018;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--t1);font:400 13px/1.5 Manrope,system-ui,sans-serif;padding:28px 16px}
main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:48px}button{font:inherit;color:inherit;cursor:pointer}
.rot b{font:500 11px var(--mono);letter-spacing:1.4px;color:var(--ouro)}.rot span{margin-left:10px;font-size:12px;color:var(--t2)}.rot{margin-bottom:12px}
.tela{background:var(--sup);border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.cab{display:flex;gap:18px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--borda)}.capa{flex:0 0 150px;aspect-ratio:16/9;border-radius:8px;background:radial-gradient(circle at 50% 40%,#5a4526,#141416 75%)}
.cab h2{margin:0;font:600 26px/1.15 "Cormorant Garamond",Georgia,serif;text-transform:uppercase}.cab .sub{font-size:12px;color:var(--t2)}.cab .esp{flex:1}
.selo{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:#222429;color:#A5ADB8;border:1px solid #35373D}.selo i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pub{background:#173524;color:#7FD49B;border-color:#23503a}.agd{background:#2a2518;color:#DFC089;border-color:#4B402B}
.bt{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:7px;border:1px solid #35373D;background:#222429;font-size:12px;font-weight:600}.bt.ouro{background:var(--ouro);border-color:var(--ouro);color:var(--souro)}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--borda);overflow-x:auto}.tab{padding:12px 12px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--t2);font-weight:600;white-space:nowrap}.tab.on{color:var(--ouro);border-bottom-color:var(--ouro)}
.corpo{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpi{padding:12px 14px;background:var(--resp);border:1px solid var(--borda);border-radius:10px}.kpi em{display:block;font-style:normal;font-size:11px;color:var(--t2)}.kpi b{font-size:22px;font-weight:700}.kpi small{display:block;font-size:11px;color:#7FD49B}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.f{height:34px;padding:0 12px;border:1px solid var(--borda);border-radius:7px;background:var(--resp);color:var(--t2);font-size:12px;display:inline-flex;align-items:center}.f.busca{flex:1 1 200px;color:var(--t3)}
.tab-l{border:1px solid var(--borda);border-radius:10px;overflow:hidden}.tr{display:grid;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--div);font-size:13px}.tr:first-child{border-top:0;background:#151619;font-size:11px;color:var(--t2)}.tr .n{font-weight:600}
.barra{height:6px;border-radius:3px;background:#2E3036;overflow:hidden}.barra i{display:block;height:100%;background:var(--ouro)}
.av{width:28px;height:28px;border-radius:50%;background:#2a2518;color:var(--ouro);display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-right:8px}
.grafico{display:flex;align-items:flex-end;gap:6px;height:140px;padding:12px;background:var(--resp);border:1px solid var(--borda);border-radius:10px}.grafico i{flex:1;background:linear-gradient(#E2C68C,#8a6e3e);border-radius:3px 3px 0 0}
.com{padding:12px 14px;border:1px solid var(--borda);border-radius:10px;background:var(--resp);margin-bottom:8px}.com b{font-size:13px}.com em{font-style:normal;color:var(--t3);font-size:11px;margin-left:6px}.com p{margin:4px 0 0;color:var(--t2)}
.sobre{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{padding:14px;background:var(--resp);border:1px solid var(--borda);border-radius:10px}.box h4{margin:0 0 6px;font-size:12px;color:var(--t2);font-weight:600}
/* B */.b-grade{display:grid;grid-template-columns:210px minmax(0,1fr)}.b-nav{padding:12px;border-right:1px solid var(--borda);background:#16171a;display:flex;flex-direction:column;gap:2px}.b-nav button{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:0;border-radius:7px;background:none;color:var(--t2);font-weight:600;text-align:left}.b-nav button.on{background:#2a2518;color:var(--ouro)}.b-nav em{font-style:normal;font:500 10px var(--mono);color:var(--t3)}
/* C */.c-resumo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:16px 20px;border-bottom:1px solid var(--borda)}.c-resumo .kpi b{font-size:18px}.pills{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 0}.pill{height:32px;padding:0 14px;border:1px solid var(--borda);border-radius:999px;background:var(--resp);color:var(--t2);font-weight:600;font-size:12px}.pill.on{background:var(--ouro);border-color:var(--ouro);color:var(--souro)}
@media(max-width:860px){.kpis,.c-resumo{grid-template-columns:repeat(2,minmax(0,1fr))}.b-grade{grid-template-columns:1fr}.b-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--borda)}.sobre{grid-template-columns:1fr}.cab{flex-wrap:wrap}}
</style>
<main id="m"></main>
<script>
const ABAS=[["sobre","Sobre o produto"],["conteudo","Conteúdo"],["alunos","Alunos","38"],["aulas","Aulas","50"],["engaj","Engajamento"],["ranking","Ranking"],["coment","Comentários","12"]];
const f=(...x)=>'<div class="filtros">'+x.map(t=>'<span class="f'+(t[0]==="?"?" busca":"")+'">'+(t[0]==="?"?t.slice(1):t+" ▾")+'</span>').join("")+'</div>';
const kp=L=>'<div class="kpis">'+L.map(([e,b,s])=>'<div class="kpi"><em>'+e+'</em><b>'+b+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>').join("")+'</div>';
const tab=(cols,linhas)=>'<div class="tab-l">'+[cols.map(c=>c[0])].concat(linhas).map((l,k)=>'<div class="tr" style="grid-template-columns:'+cols.map(c=>c[1]).join(" ")+'">'+l.map((x,j)=>'<span'+(k&&j===0?' class="n"':'')+'>'+x+'</span>').join("")+'</div>').join("")+'</div>';
const bar=p=>'<div class="barra"><i style="width:'+p+'%"></i></div>';
const C={
 sobre:()=>'<div class="sobre"><div class="box"><h4>Descrição</h4>Aion. Gravação da aula do dia 12/11. O maior aplicativo de espiritualidade da América Latina.</div><div class="box"><h4>Liberação</h4><b>15/09/2026</b> · Imediata<br><span style="color:var(--t2)">Status: Publicado · Categoria: Mentoria · Preço: R$ 1.997</span></div><div class="box"><h4>Card do produto</h4><div class="capa" style="width:100%;flex:none"></div></div><div class="box"><h4>Ações</h4><div style="display:flex;flex-wrap:wrap;gap:6px"><span class="bt">Editar curso</span><span class="bt">Liberação</span><span class="bt">Ver como aluno</span><span class="bt">Duplicar</span></div></div></div>',
 conteudo:()=>kp([["Módulos","12","10 publicados"],["Aulas","50","44 publicadas"],["Horas de conteúdo","31h 20min"],["Agendados","6","próximo 20/11"]])+f("?Pesquisar módulo ou aula","Todos os status","Tipo","Ordem do conteúdo")+tab([["Módulo","2fr"],["Aulas","70px"],["Duração","90px"],["Status","110px"],["Liberado em","110px"]],[["Módulo 0 — Boas-vindas","3","48 min",'<span class="selo pub"><i></i>Publicado</span>',"15/09"],["Módulo 1 — Fundamentos","6","3h 10min",'<span class="selo pub"><i></i>Publicado</span>',"22/09"],["Módulo 2 — Diagnóstico","5","2h 40min",'<span class="selo agd"><i></i>Agendado</span>',"20/11"]]),
 alunos:()=>kp([["Alunos","38","+5 este mês"],["Ativos (7 dias)","24"],["Concluíram","9"],["Progresso médio","46%"]])+f("?Pesquisar nome ou e-mail","Situação","Progresso","Último acesso","Entrada")+tab([["Aluno","2fr"],["Entrou em","100px"],["Progresso","1.2fr"],["Último acesso","110px"],["Situação","90px"]],[['<span class="av">MS</span>Maria Silva',"02/10",bar(82)+"82%","hoje","Ativo"],['<span class="av">JP</span>João Pedro',"05/10",bar(40)+"40%","há 3 dias","Ativo"],['<span class="av">AL</span>Ana Lima',"10/10",bar(5)+"5%","há 20 dias","Parado"]]),
 aulas:()=>kp([["Aulas","50"],["Mais assistida","Aula 1","312 views"],["Conclusão média","61%"],["Tempo assistido","412 h"]])+f("?Pesquisar aula","Módulo","Tipo","Status","Mais assistidas")+tab([["Aula","2fr"],["Módulo","1fr"],["Views","70px"],["Concluíram","1fr"],["Status","110px"]],[["Aula 1 — Começando","Módulo 0","312",bar(88)+"88%",'<span class="selo pub"><i></i>Publicado</span>'],["Aula 2 — Seu ponto de partida","Módulo 0","276",bar(71)+"71%",'<span class="selo pub"><i></i>Publicado</span>'],["Aula 3 — Prática","Módulo 1","120",bar(32)+"32%",'<span class="selo agd"><i></i>Agendado</span>']]),
 engaj:()=>kp([["Acessos (30 dias)","1.248","+18%"],["Alunos ativos","24 de 38"],["Comentários","12"],["Taxa de conclusão","24%"]])+f("Últimos 30 dias","Módulo")+'<div class="grafico">'+[30,45,38,60,52,70,64,80,72,90,76,95,88,100].map(h=>'<i style="height:'+h+'%"></i>').join("")+'</div>',
 ranking:()=>f("?Pesquisar aluno","Por progresso","Por tempo assistido","Período")+tab([["#","40px"],["Aluno","2fr"],["Progresso","1.4fr"],["Tempo","90px"],["Aulas","70px"]],[["1",'<span class="av">MS</span>Maria Silva',bar(82)+"82%","18h","41"],["2",'<span class="av">RC</span>Rita Costa',bar(77)+"77%","16h","38"],["3",'<span class="av">JP</span>João Pedro',bar(40)+"40%","9h","20"]]),
 coment:()=>f("?Pesquisar comentário","Aula","Status","Mais antigos")+'<div class="com"><b>Maria Silva</b><em>Aula 1 · há 2 h</em><p>Que aula linda, me tocou muito.</p></div><div class="com"><b>João Pedro</b><em>Aula 3 · ontem</em><p>Não consegui abrir o PDF desta aula.</p></div>'
};
function cab(){return '<div class="cab"><span class="capa"></span><div><h2>Bênçãos Ilimitadas</h2><span class="sub">Vídeo · Mentoria · 12 módulos · 50 aulas · 38 alunos</span></div><span class="esp"></span><span class="selo pub"><i></i>Publicado</span><span class="bt">Liberação</span><span class="bt ouro">Editar curso</span></div>'}
const est={A:"sobre",B:"sobre",C:"sobre"};
function desenhar(){m.innerHTML=
 '<section><div class="rot"><b>MODELO A</b><span>Abas no topo, embaixo do cabeçalho do produto</span></div><div class="tela">'+cab()+'<div class="tabs">'+ABAS.map(a=>'<button class="tab'+(est.A===a[0]?" on":"")+'" data-o="A" data-t="'+a[0]+'">'+a[1]+(a[2]?' <span style="color:var(--t3)">'+a[2]+'</span>':'')+'</button>').join("")+'</div><div class="corpo">'+C[est.A]()+'</div></div></section>'+
 '<section><div class="rot"><b>MODELO B</b><span>Menu lateral dentro da página do produto</span></div><div class="tela">'+cab()+'<div class="b-grade"><nav class="b-nav">'+ABAS.map(a=>'<button class="'+(est.B===a[0]?"on":"")+'" data-o="B" data-t="'+a[0]+'">'+a[1]+(a[2]?'<em>'+a[2]+'</em>':'')+'</button>').join("")+'</nav><div class="corpo">'+C[est.B]()+'</div></div></div></section>'+
 '<section><div class="rot"><b>MODELO C</b><span>Painel de números no topo + abas em pílulas</span></div><div class="tela">'+cab()+'<div class="c-resumo">'+[["Módulos","12"],["Aulas","50"],["Horas","31h 20"],["Alunos","38"],["Ativos","24"],["Conclusão","24%"]].map(([e,b])=>'<div class="kpi"><em>'+e+'</em><b>'+b+'</b></div>').join("")+'</div><div class="pills">'+ABAS.map(a=>'<button class="pill'+(est.C===a[0]?" on":"")+'" data-o="C" data-t="'+a[0]+'">'+a[1]+'</button>').join("")+'</div><div class="corpo">'+C[est.C]()+'</div></div></section>'}
document.addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(!b)return;est[b.dataset.o]=b.dataset.t;const y=scrollY;desenhar();scrollTo(0,y)});
desenhar();
</script>
