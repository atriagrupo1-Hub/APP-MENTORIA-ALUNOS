<title>ION Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700;900&family=Playfair+Display:wght@600&family=Montserrat:wght@600;800&family=Cinzel:wght@600&display=swap">
<style>
/* Layout: barra de topo com o seletor Administração | Área do Aluno; painel SaaS com menu lateral; app da aluna em moldura de celular. */
:root {
  color-scheme: dark;
  --fundo: #0B0B0D; --fundo2: #151518; --cartao: #1E1E22; --cartao2: #26262B; --borda: #303034;
  --ouro: #C9A45C; --ouro2: #E0C589; --ouro-esc: #8E6F33; --texto: #F4F2ED; --texto2: #A8A8AD; --texto3: #75757B;
  --verde: #6FBF8A; --amarelo: #E2B857; --vermelho: #E07A6B; --azul: #7FA8D6;
  --f-tit: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-txt: "Lato", "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --r2: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--fundo); color: var(--texto); font: 400 14px/1.5 var(--f-txt); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fundo2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ouro2); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-tit); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- topo ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--fundo2); border-bottom: 1px solid var(--borda); }
.marca { display: flex; align-items: baseline; gap: 8px; }
.marca b { font: 700 22px/1 var(--f-tit); letter-spacing: .14em; color: var(--ouro2); }
.marca span { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--texto2); }
.seletor { display: inline-flex; padding: 3px; background: var(--fundo); border: 1px solid var(--borda); border-radius: 999px; }
.seletor button { padding: 7px 14px; border: 0; border-radius: 999px; background: none; color: var(--texto2); font-weight: 700; font-size: 13px; }
.seletor button[aria-pressed="true"] { background: var(--ouro); color: #1a1408; }
.topo .esp { flex: 1; }
.demo-selo { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 12px; color: var(--amarelo); border: 1px dashed rgba(226,184,87,.5); border-radius: 999px; }
.demo-selo button { border: 0; background: none; color: var(--ouro2); text-decoration: underline; font-size: 12px; padding: 0; }

/* ---------- botões e campos ---------- */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); font-weight: 700; font-size: 13px; white-space: nowrap; }
.bt:hover { border-color: var(--texto3); }
.bt.ouro { background: linear-gradient(180deg, var(--ouro2), var(--ouro)); color: #1a1408; border-color: var(--ouro); }
.bt.ouro:hover { filter: brightness(1.05); }
.bt.perigo { color: var(--vermelho); border-color: rgba(224,122,107,.45); background: transparent; }
.bt.fant { background: transparent; border-color: transparent; color: var(--texto2); }
.bt.pq { min-height: 32px; padding: 0 10px; font-size: 12px; }
.bt:disabled { opacity: .45; cursor: default; filter: none; }
.bt svg, .ic svg { width: 16px; height: 16px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.campo { width: 100%; min-height: 40px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--fundo2); color: var(--texto); }
textarea.campo { resize: vertical; min-height: 84px; line-height: 1.55; }
.campo:focus { border-color: var(--ouro); outline: none; }
label.g, .g { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.g > span:first-child, .rot { font-size: 12px; font-weight: 700; color: var(--texto2); letter-spacing: .02em; }
.g em { font-style: normal; font-size: 12px; color: var(--texto3); }
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grade3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 760px) { .grade2, .grade3 { grid-template-columns: 1fr; } }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto); }
.chk input { accent-color: var(--ouro); width: 16px; height: 16px; }
.erro-campo { color: var(--vermelho); font-size: 12px; }

/* ---------- selos de estado ---------- */
.st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.verde { color: var(--verde); background: rgba(111,191,138,.1); border-color: rgba(111,191,138,.25); }
.st.amarelo { color: var(--amarelo); background: rgba(226,184,87,.1); border-color: rgba(226,184,87,.25); }
.st.vermelho { color: var(--vermelho); background: rgba(224,122,107,.1); border-color: rgba(224,122,107,.25); }
.st.azul { color: var(--azul); background: rgba(127,168,214,.1); border-color: rgba(127,168,214,.25); }
.st.cinza { color: var(--texto2); background: rgba(168,168,173,.08); border-color: rgba(168,168,173,.2); }
.st.ouro { color: var(--ouro2); background: rgba(201,164,92,.1); border-color: rgba(201,164,92,.3); }
.st.sem::before { display: none; }

/* ---------- painel ---------- */
.adm { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100% - 58px); }
.lado { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 58px); display: flex; flex-direction: column; gap: 2px; padding: 18px 12px; background: var(--fundo2); border-right: 1px solid var(--borda); overflow-y: auto; }
.lado button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: var(--texto2); font-weight: 700; font-size: 14px; text-align: left; }
.lado button:hover { color: var(--texto); background: rgba(255,255,255,.03); }
.lado button[aria-current="page"] { color: var(--ouro2); background: rgba(201,164,92,.1); }
.lado .cont { margin-left: auto; font-size: 11px; color: var(--texto3); }
.lado .sep { height: 1px; margin: 10px 8px; background: var(--borda); }
.lado .quem { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--borda); font-size: 12px; color: var(--texto2); }
.main { min-width: 0; padding-block: 26px 60px; padding-left: max(16px, min(36px, 3vw)); padding-right: max(16px, min(36px, 3vw)); }
.cab { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.cab h1 { font-size: 34px; line-height: 1.1; }
.cab p { color: var(--texto2); margin-top: 4px; }
.cab .esp { flex: 1; }
.trilha { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--texto3); margin-bottom: 8px; }
.trilha button { border: 0; background: none; padding: 0; color: var(--texto2); }
.trilha button:hover { color: var(--ouro2); }
.painel { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r2); padding: 18px 20px; }
.painel > h3 { font-size: 21px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.painel > h3 .esp { flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-align: left; border: 1px solid var(--borda); border-radius: var(--r); background: var(--cartao); color: var(--texto); }
.kpi:hover { border-color: var(--ouro-esc); }
.kpi b { font: 600 32px/1 var(--f-tit); color: var(--texto); }
.kpi span { font-size: 12px; color: var(--texto2); font-weight: 700; }
.kpi i { font-style: normal; font-size: 11px; color: var(--texto3); }
.duas { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .duas { grid-template-columns: 1fr; } }
.ativ { display: flex; flex-direction: column; }
.ativ li { list-style: none; display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--borda); }
.ativ li:last-child { border-bottom: 0; }
.ativ .pt { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(201,164,92,.1); color: var(--ouro2); flex: none; }
.ativ .tx { flex: 1; min-width: 0; }
.ativ .tx em { display: block; font-style: normal; font-size: 12px; color: var(--texto3); }
.vazio { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 16px; text-align: center; color: var(--texto2); }
.vazio .vz-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(201,164,92,.08); color: var(--ouro); }
.vazio b { font: 600 20px/1.2 var(--f-tit); color: var(--texto); }
.barra-f { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.barra-f .busca { flex: 1 1 240px; position: relative; }
.barra-f .busca svg { position: absolute; left: 11px; top: 11px; color: var(--texto3); }
.barra-f .busca .campo { padding-left: 34px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--borda); background: transparent; color: var(--texto2); font-size: 12px; font-weight: 700; }
.chip[aria-pressed="true"] { color: #1a1408; background: var(--ouro); border-color: var(--ouro); }
.chip i { font-style: normal; opacity: .7; margin-left: 4px; }
.tab-rola { overflow-x: auto; border: 1px solid var(--borda); border-radius: var(--r2); background: var(--cartao); }
table.t { width: 100%; border-collapse: collapse; min-width: 820px; }
.t th { text-align: left; padding: 11px 14px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--texto3); border-bottom: 1px solid var(--borda); white-space: nowrap; }
.t td { padding: 11px 14px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover { background: rgba(255,255,255,.02); }
.t td.acoes { text-align: right; white-space: nowrap; }
.pessoa { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pessoa b { display: block; }
.pessoa em { display: block; font-style: normal; font-size: 12px; color: var(--texto3); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 900; font-size: 12px; color: #1a1408; background: linear-gradient(135deg, var(--ouro2), var(--ouro-esc)); overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.g { width: 64px; height: 64px; font-size: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.cc { display: flex; flex-direction: column; border: 1px solid var(--borda); border-radius: var(--r2); background: var(--cartao); overflow: hidden; min-width: 0; }
.cc .capa { aspect-ratio: 16 / 9; }
.cc .cc-c { display: flex; flex-direction: column; gap: 8px; padding: 14px; flex: 1; }
.cc h4 { margin: 0; font: 600 20px/1.15 var(--f-tit); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--texto2); }
.cc .pe { display: flex; gap: 8px; align-items: center; margin-top: auto; padding-top: 6px; }
.capa { flex: none; position: relative; display: flex; align-items: flex-end; padding: 14px; overflow: hidden; color: #fff; background: var(--cartao2); max-width: 100%; }
.capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.55)); }
.capa b { position: relative; z-index: 1; font: 600 22px/1.05 var(--f-tit); letter-spacing: .02em; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.capa small { position: absolute; z-index: 1; top: 12px; left: 14px; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.75); }
.capa.pe { aspect-ratio: 2 / 3; }
.menu-pt { position: relative; }
.menu-pt .lista { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 210px; padding: 6px; border: 1px solid var(--borda); border-radius: 12px; background: var(--fundo2); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
.menu-pt .lista button { display: flex; width: 100%; gap: 9px; align-items: center; padding: 9px 10px; border: 0; border-radius: 8px; background: none; color: var(--texto); font-size: 13px; text-align: left; }
.menu-pt .lista button:hover { background: rgba(255,255,255,.05); }
.menu-pt .lista button.perigo { color: var(--vermelho); }
.menu-pt .lista hr { border: 0; height: 1px; background: var(--borda); margin: 4px 0; }

/* ---------- assistente ---------- */
.passos { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.passos button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto2); font-weight: 700; font-size: 13px; }
.passos button i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--cartao2); color: var(--texto2); }
.passos button[aria-current="step"] { color: #1a1408; background: var(--ouro); border-color: var(--ouro); }
.passos button[aria-current="step"] i { background: rgba(0,0,0,.18); color: #1a1408; }
.passos button.ok i { background: var(--verde); color: #0b0b0d; }
.form { display: flex; flex-direction: column; gap: 16px; max-width: 980px; }
.rodape-f { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 14px; border-top: 1px solid var(--borda); }
.rodape-f .esp { flex: 1; }
.mod { border: 1px solid var(--borda); border-radius: var(--r); background: var(--fundo2); }
.mod-cab { display: flex; gap: 10px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
.mod-cab .n { font-size: 11px; font-weight: 900; letter-spacing: .12em; color: var(--ouro); text-transform: uppercase; flex: none; }
.mod-cab .campo { flex: 1 1 200px; min-height: 36px; }
.aulas { display: flex; flex-direction: column; border-top: 1px solid var(--borda); }
.aula-l { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
.aula-l:last-child { border-bottom: 0; }
.aula-l .tit { flex: 1 1 180px; min-width: 0; }
.aula-l .tit b { display: block; font-size: 14px; }
.aula-l .tit em { font-style: normal; font-size: 12px; color: var(--texto3); }
.tipo-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: rgba(201,164,92,.1); color: var(--ouro2); flex: none; }
.mini-bts { display: inline-flex; gap: 4px; }
.mini-bts button { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--borda); border-radius: 8px; background: transparent; color: var(--texto2); }
.mini-bts button:hover { color: var(--texto); border-color: var(--texto3); }
.mini-bts button:disabled { opacity: .3; cursor: default; }
.aviso { padding: 11px 14px; border-radius: 10px; font-size: 13px; border: 1px solid rgba(201,164,92,.35); background: rgba(201,164,92,.07); color: var(--texto); }
.aviso.ruim { border-color: rgba(224,122,107,.4); background: rgba(224,122,107,.07); }
.aviso.bom { border-color: rgba(111,191,138,.4); background: rgba(111,191,138,.07); }
.op-lib { display: flex; flex-direction: column; gap: 8px; }
.op-lib label { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo2); }
.op-lib label:has(input:checked) { border-color: var(--ouro); background: rgba(201,164,92,.06); }
.op-lib input { accent-color: var(--ouro); margin-top: 3px; }
.op-lib b { display: block; font-size: 14px; }
.op-lib em { font-style: normal; font-size: 12px; color: var(--texto3); }
.resumo-l { display: grid; grid-template-columns: 170px 1fr; gap: 6px 16px; font-size: 13px; }
.resumo-l dt { color: var(--texto3); }
.resumo-l dd { margin: 0; }
.prev-card { max-width: 290px; }

/* ---------- janelas ---------- */
.fundo-m { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); }
.janela { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; border: 1px solid var(--borda); border-radius: var(--r2); background: var(--fundo2); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.janela.larga { width: min(980px, 100%); }
.janela.estreita { width: min(460px, 100%); }
.jan-cab { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--fundo2); border-bottom: 1px solid var(--borda); }
.jan-cab h2 { font-size: 24px; flex: 1; }
.jan-cab .x { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--borda); background: none; color: var(--texto2); font-size: 18px; }
.jan-corpo { display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; }
.jan-pe { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px; background: var(--fundo2); border-top: 1px solid var(--borda); }
.abas { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--borda); }
.abas button { padding: 10px 13px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--texto2); font-weight: 700; font-size: 13px; white-space: nowrap; }
.abas button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--ouro); }
.lin { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
.lin:last-child { border-bottom: 0; }
.lin .tx { flex: 1 1 200px; min-width: 0; }
.lin .tx em { display: block; font-style: normal; font-size: 12px; color: var(--texto3); }
.foto-up { display: flex; align-items: center; gap: 14px; }
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 11px 16px; border-radius: 10px; background: var(--texto); color: #111; font-weight: 700; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); }

/* ---------- app da aluna ---------- */
.palco { display: flex; justify-content: center; gap: 28px; padding-block: 26px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.lado-demo { width: 300px; display: flex; flex-direction: column; gap: 14px; }
.lado-demo .painel { padding: 16px; }
.lado-demo h3 { font-size: 20px; }
.lado-demo p { color: var(--texto2); font-size: 13px; }
.cel { position: relative; isolation: isolate; width: 390px; max-width: 100%; height: 800px; max-height: calc(100vh - 110px); min-height: 600px; border: 10px solid #000; border-radius: 44px; background: var(--fundo); overflow: hidden; box-shadow: 0 0 0 1px var(--borda), 0 40px 100px rgba(0,0,0,.6); display: flex; flex-direction: column; }
@media (max-width: 720px) { .cel { border: 0; border-radius: 0; width: 100%; height: calc(100vh - 120px); max-height: none; box-shadow: none; } .palco { padding-left: 0; padding-right: 0; padding-block: 0; } .lado-demo { order: 2; width: 100%; padding: 0 16px 20px; } }
.app-topo { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.app-topo .marca b { font-size: 18px; }
.app-topo .esp { flex: 1; }
.ib { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); }
.ib .bol { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--ouro); box-shadow: 0 0 0 2px var(--cartao); }

        ${lista.map((a) => { const cs = matriculasDe(a.id).map((m) => item(m.conteudoId)).filter((x) => x && x.tipo === "curso"); const pm = cs.length ? Math.round(cs.reduce((s, c) => s + progressoCurso(a.id, c), 0) / cs.length) : 0; return `<tr><td><button class="pessoa link-p" data-a="ficha" data-v="${a.id}">${avatar(a)}<span><b>${h(a.nome)}</b><em>${h(a.email)}</em></span></button></td><td class="num"><span class="codigo">${h(a.codigo.slice(0, 2))}••••</span></td><td class="num">${h(a.whats || "—")}</td><td>${a.mentoria === "mentoria" ? `<span class="st ouro sem">Mentoria</span>` : `<span class="st cinza sem">Geral</span>`}</td><td>${h(S.turmas.find((t) => t.id === a.turma)?.nome || "—")}</td><td class="num">${fmt(a.entrada)}</td><td>${stAluno(a.status)}</td><td class="num">${matriculasDe(a.id).filter((m) => m.status === "ativa").length}</td><td><div style="display:flex;align-items:center;gap:8px;min-width:110px"><div class="barra" style="flex:1"><i style="width:${pm}%"></i></div><span class="num">${pm}%</span></div></td><td style="color:var(--texto2)">${S.posicoes[a.id]?.ultima ? "Estudando" : Object.keys(S.progresso[a.id] || {}).length ? "Com progresso" : "Sem dados"}</td><td class="acoes">${btn("ficha", "Abrir ficha", `data-v="${a.id}"`, "pq")}</td></tr>`; }).join("")}</tbody></table></div>`}`;

  if (aba === "matriculas") return `<div class="barra-f"><p style="flex:1;color:var(--texto2)">Cada linha é um conteúdo liberado para um aluno. Suspender um não afeta os outros.</p>${btn("mat-geral", ic("mais") + "Nova matrícula", "", "ouro")}</div>${S.matriculas.length ? `<div class="tab-rola"><table class="t"><thead><tr><th>Aluno</th><th>Conteúdo</th><th>Início</th><th>Fim</th><th>Situação</th><th></th></tr></thead><tbody>${S.matriculas.map((m) => { const a = aluno(m.alunoId), x = item(m.conteudoId); return `<tr><td>${h(a?.nome || "—")}</td><td>${x ? `${h(TIPOS[x.tipo].nome)} · ${h(x.titulo)}` : "Removido"}</td><td class="num">${fmt(m.inicio)}</td><td class="num">${m.fim ? fmt(m.fim) : "Sem prazo"}</td><td>${m.status === "ativa" ? (m.inicio > hojeISO() ? `<span class="st azul">Começa ${fmt(m.inicio)}</span>` : `<span class="st verde">Liberada</span>`) : m.status === "bloqueada" ? `<span class="st vermelho">Bloqueada</span>` : `<span class="st amarelo">Suspensa</span>`}</td><td class="acoes">${btn("mat-alt", m.status === "ativa" ? "Suspender" : "Restaurar", `data-v="${m.id}"`, "pq")} ${btn("mat-bloq", m.status === "bloqueada" ? "Desbloquear" : "Bloquear", `data-v="${m.id}"`, "pq")}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="painel">${vazioH("ok", "Nenhuma matrícula", "Matricule pela ficha do aluno ou aqui.")}</div>`}`;
  if (aba === "acessos") { const l = S.alunos.filter((a) => a.status !== "ativo"); return `<div class="aviso" style="margin-bottom:14px">Suspender ou bloquear não apaga progresso. Ao restaurar, o aluno continua de onde parou.</div><section class="painel">${l.length ? l.map((a) => `<div class="lin">${avatar(a)}<div class="tx"><b>${h(a.nome)}</b><em>${a.status === "bloqueado" ? "Bloqueado" : "Suspenso"}</em></div>${btn("acesso-set", "Restaurar acesso", `data-v="${a.id}" data-s="ativo"`, "pq ouro")}</div>`).join("") : vazioH("ok", "Todos com acesso ativo", "Alunos suspensos ou bloqueados aparecem aqui.")}</section>`; }

  return `<section class="painel">${S.historico.filter((x) => x.area === "alunos").map((x) => `<div class="lin"><div class="tx">${h(x.texto)}<em>${fmt(x.quando)} ${x.quando.slice(11, 16)} · ${h(x.quem)}</em></div></div>`).join("") || vazioH("ok", "Sem histórico", "Alterações em alunos aparecem aqui.")}</section>`;
}

function ficha(a) {

  const doTipoVe = (t) => S.conteudos.filter((x) => x.tipo === t || (t === "audio" && x.tipo === "playlist")).map((x) => ({ x, ve: podeVer(a, x), mot: motivoBloqueio(a, x) })).filter((y) => y.ve || matDe(a, y.x.id));
  let c = "";
  if (fa === "dados") c = `<div class="grade3"><div class="g"><span>WhatsApp</span>${h(a.whats || "—")}</div><div class="g"><span>E-mail</span>${h(a.email || "—")}</div><div class="g"><span>Código</span><span class="num">${h(a.codigo.slice(0, 2))}•••• ${btn("codigo-trocar", "Alterar código", `data-v="${a.id}"`, "pq")}</span></div><div class="g"><span>Mentoria</span>${a.mentoria === "mentoria" ? "Mentoria" : "Geral"}</div><div class="g"><span>Turma</span>${h(S.turmas.find((t) => t.id === a.turma)?.nome || "—")}</div><div class="g"><span>Responsável</span>${h(a.resp || "—")}</div></div><div class="g"><span>Observações</span><textarea id="fichaObs" class="campo" data-obs="${a.id}">${h(a.obs)}</textarea></div>`;
  if (fa === "matriculas") c = `<div style="display:flex;gap:8px;flex-wrap:wrap">${btn("matricular", ic("mais") + "Matricular / liberar", `data-v="${a.id}"`, "ouro")}</div>${mats.map(linhaMat).join("") || `<p style="color:var(--texto3)">Nenhuma matrícula.</p>`}`;
  if (["curso", "ebook", "audio"].includes(fa)) c = `<p style="color:var(--texto2)">Exatamente o que aparece para este aluno agora.</p>${doTipoVe(fa).map(({ x, mot }) => `<div class="lin"><span class="tipo-ic">${ic(TIPOS[x.tipo].ic)}</span><div class="tx"><b>${h(x.titulo)}</b><em>${mot ? "Com cadeado: " + h(mot) : "Abre normalmente"}${x.tipo === "curso" ? " · " + progressoCurso(a.id, x) + "%" : ""}</em></div>${stEstado(x.status)}</div>`).join("") || `<p style="color:var(--texto3)">Nada disponível.</p>`}`;
  if (fa === "progresso") c = `<p class="num"><b>${pontosDe(a.id)} pontos</b> · nível ${h(nivelDe(pontosDe(a.id)))}</p>${mats.map((m) => item(m.conteudoId)).filter((x) => x && x.tipo === "curso").map((x) => `<div class="lin"><div class="tx"><b>${h(x.titulo)}</b><em>${aulasDe(x).filter((y) => (S.progresso[a.id] || {})[y.id] === "concluida").length} de ${aulasDe(x).length} aulas</em></div><div style="width:160px"><div class="barra"><i style="width:${progressoCurso(a.id, x)}%"></i></div></div><b class="num">${progressoCurso(a.id, x)}%</b></div>`).join("") || `<p style="color:var(--texto3)">Sem cursos.</p>`}`;
  if (fa === "recompensas") c = `${S.resgates.filter((r) => r.alunoId === a.id).map((r) => `<div class="lin"><div class="tx"><b>${h(S.recompensas.find((x) => x.id === r.recompensaId)?.nome || "—")}</b><em>${fmt(r.data)} · ${r.pontos} pontos</em></div><span class="st ${r.status === "liberado" ? "verde" : "amarelo"}">${r.status === "liberado" ? "Liberado" : "Solicitado"}</span></div>`).join("") || `<p style="color:var(--texto3)">Nenhum resgate.</p>`}`;
  if (fa === "comentarios") c = S.comentarios.filter((x) => x.alunoId === a.id).map((x) => `<div class="lin"><div class="tx">${h(x.texto)}<em>${fmt(x.data)} · ${x.estado}</em></div></div>`).join("") || `<p style="color:var(--texto3)">Nenhum comentário.</p>`;
  if (fa === "historico") c = S.historico.filter((x) => x.texto.includes(a.nome)).map((x) => `<div class="lin"><div class="tx">${h(x.texto)}<em>${fmt(x.quando)} ${x.quando.slice(11, 16)}</em></div></div>`).join("") || `<p style="color:var(--texto3)">Sem alterações registradas.</p>`;

        ${ui.respondendo === x.id ? `<div style="display:flex;gap:8px;margin-top:8px"><input id="respCampo" class="campo" placeholder="Escreva a resposta" />${btn("com-resp-ok", "Enviar", `data-v="${x.id}"`, "ouro pq")}</div>` : ""}</div>
        <div style="display:flex;flex-direction:column;gap:6px">${x.estado !== "aprovado" ? btn("com-set", "Aprovar", `data-v="${x.id}" data-s="aprovado"`, "pq ouro") : ""}${btn("com-resp", "Responder", `data-v="${x.id}"`, "pq")}${btn("com-fixar", x.fixado ? "Desafixar" : "Fixar", `data-v="${x.id}"`, "pq")}${x.estado !== "oculto" ? btn("com-set", "Ocultar", `data-v="${x.id}" data-s="oculto"`, "pq") : ""}${btn("com-excluir", "Excluir", `data-v="${x.id}"`, "pq perigo")}</div></div>`; }).join("") : vazioH("balao", "Nada por aqui", "Comentários das aulas aparecem aqui para moderar.")}</section>`;

  const cs = doTipo("curso");
  return `<section class="painel"><h3>Tutor de IA</h3><div class="form"><div class="grade3"><label class="g"><span>Nome do tutor</span><input id="iaNome" class="campo" data-ia="nome" value="${h(S.ia.nome)}" /></label><label class="g"><span>Avatar (letra)</span><input id="iaAv" class="campo" data-ia="avatar" maxlength="2" value="${h(S.ia.avatar)}" /></label><div class="g"><span>Ativo</span><label class="chk"><input id="iaAt" type="checkbox" data-ia-chk="ativa" ${S.ia.ativa ? "checked" : ""} />Tutor ligado na plataforma</label></div></div>

    <div class="rot">Por curso (cada aula pode desligar na aba “Perguntar à IA”)</div>${cs.map((c) => `<label class="chk"><input id="iaC-${c.id}" type="checkbox" data-ia-curso="${c.id}" ${c.ia?.ativa ? "checked" : ""} />${h(c.titulo)}</label>`).join("") || `<p style="color:var(--texto3)">Sem cursos.</p>`}

/* ---------- Recompensas e promoções ---------- */
function admRecompensas(aba) {
