<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>AIŌN · Aplicativo</title>
<link rel="icon" href="/favicon-32.png" />
<style>
  :root { --ouro: #e2c68c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 20px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eeeef0;
    background: radial-gradient(120% 90% at 50% 0%, #2b241a 0%, #121113 55%, #0b0b0c 100%);
    overflow: hidden;
  }
  .topo { display: flex; align-items: center; gap: 14px; }
  .marca { font-size: 26px; font-weight: 600; letter-spacing: 6px; color: var(--ouro); }
  .bt { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font: 600 13px system-ui, sans-serif; color: #eeeef0; background: #222429; border: 1px solid #35373d; border-radius: 8px; cursor: pointer; }
  .bt:hover { border-color: var(--ouro); }
  /* Celular: 390 × 844 (iPhone), reduzido para caber na altura da tela */
  .celular {
    --w: 430px; --h: 932px;
    position: relative; width: calc(var(--w) + 28px); height: calc(var(--h) + 28px);
    padding: 14px; border-radius: 58px; background: #050506;
    box-shadow: 0 0 0 2px #3a3530, 0 0 0 6px #17151a, 0 40px 90px rgba(0,0,0,.65), inset 0 0 0 1px #2a2a2e;
    transform-origin: top center;
  }
  .tela { position: relative; width: var(--w); height: var(--h); border-radius: 46px; overflow: hidden; background: #000; }
  .tela { display: flex; flex-direction: column; }
  .status { flex: 0 0 54px; display: flex; align-items: center; justify-content: space-between; padding: 14px 34px 0 40px; font: 600 16px -apple-system, "SF Pro Text", system-ui, sans-serif; color: #fff; background: #000; }
  .status .ic { display: flex; align-items: center; gap: 6px; }
  .status svg { height: 13px; fill: #fff; }
  .tela iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #000; }
  .home { flex: 0 0 26px; display: grid; place-items: center; background: #000; }
  .home i { width: 140px; height: 5px; background: #fff; border-radius: 3px; opacity: .85; }
  .ilha { position: absolute; top: 12px; left: 50%; z-index: 3; width: 120px; height: 34px; transform: translateX(-50%); background: #000; border-radius: 20px; pointer-events: none; }
  .botao-lado { position: absolute; right: -4px; top: 190px; width: 4px; height: 90px; background: #2a2620; border-radius: 0 3px 3px 0; }
  .botao-lado.e1 { left: -4px; right: auto; top: 160px; height: 40px; border-radius: 3px 0 0 3px; }
  .botao-lado.e2 { left: -4px; right: auto; top: 220px; height: 64px; border-radius: 3px 0 0 3px; }
</style>
</head>
<body>
  <div class="topo">
    <span class="marca">AIŌN</span>
    <button class="bt" type="button" onclick="document.getElementById('app').src='/'">↺ Recomeçar</button>
  </div>
  <div class="celular" id="cel">
    <span class="botao-lado"></span><span class="botao-lado e1"></span><span class="botao-lado e2"></span>
    <div class="tela">
      <div class="ilha"></div>
      <div class="status"><span id="hora">9:41</span><span class="ic">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.3-1.4A10.6 10.6 0 0 0 8 .5 10.6 10.6 0 0 0 .7 3.5L2 4.9c1.6-1.5 3.7-2.4 6-2.4zm0 4c1.2 0 2.3.5 3.2 1.2l1.3-1.4A6.6 6.6 0 0 0 8 4.5c-1.7 0-3.3.7-4.5 1.8l1.3 1.4C5.7 7 6.8 6.5 8 6.5zm0 4 2-2.1a2.8 2.8 0 0 0-4 0z"/></svg>
        <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.8"/><rect x="24.5" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
      </span></div>
      <iframe id="app" src="/" title="Aplicativo AIŌN" allow="autoplay; fullscreen; clipboard-write"></iframe>
      <div class="home"><i></i></div>
    </div>
  </div>
<script>
  // Encolhe o celular para caber na altura da janela (nunca aumenta).
  function ajustar() {
    var cel = document.getElementById("cel");
    var livre = window.innerHeight - 110, alto = 960, largo = 458;
    var e = Math.min(1, livre / alto, (window.innerWidth - 32) / largo);
    cel.style.transform = "scale(" + e + ")";
    cel.style.marginBottom = (-(alto * (1 - e))) + "px";
  }
  window.addEventListener("resize", ajustar); ajustar();
  // Cadastro de demonstração já preenchido na tela de entrada do app (dá para apagar e digitar outro).
  var DEMO = ["Rodrigo M.", "1234"];
  function preencher() {
    try {
      var d = document.getElementById("app").contentDocument; if (!d) return;
      var ins = d.querySelectorAll("input"); if (ins.length < 2) return;
      [0, 1].forEach(function (i) {
        var el = ins[i]; if (el.value || el.dataset.demo) return;
        var set = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set;
        set.call(el, DEMO[i]); el.dataset.demo = "1";
        el.dispatchEvent(new Event("input", { bubbles: true })); el.dispatchEvent(new Event("change", { bubbles: true }));
      });
    } catch (e) {}
  }
  setInterval(preencher, 700);
  function hora() { var d = new Date(); document.getElementById("hora").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
  hora(); setInterval(hora, 20000);
</script>
</body>
</html>
